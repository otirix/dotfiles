# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

input {
  kb_layout = us,ma
}


# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

windowrule = workspace 1, match:class ^(kitty)$
windowrule = workspace 1, match:class ^(com.mitchellh.ghostty)$
windowrule = workspace 1, match:class ^(org.wezfurlong.wezterm)$
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(microsoft-edge)$
windowrule = workspace 2, match:class ^(Microsoft-edge)$
windowrule = workspace 2, match:class ^(google-chrome)$
windowrule = workspace 4, match:class ^(discord)$
windowrule = workspace 5, match:class ^(Spotify)$
windowrule = workspace 5, match:initial_title ^(Spotify)$
windowrule = workspace 6, match:class ^(teams-for-linux)$
windowrule = workspace 7, stay_focused on, min_size 1 1, match:title ^(Steam)$, match:class ^(steam)$

# Picture-in-Picture
windowrule = tag +picture-in-picture, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = float true,           match:tag picture-in-picture
windowrule = keep_aspect_ratio true, match:tag picture-in-picture
windowrule = move 73% 72%,    match:tag picture-in-picture
# windowrule = size 25%,        match:tag picture-in-picture
windowrule = float true,           match:tag picture-in-picture
windowrule = pin true,             match:tag picture-in-picture

exec-once = ghostty
exec-once = google-chrome
exec-once = discord
exec-once = spotify
